name: rot-check
# Anti-pourrissement : vérifie chaque semaine que les sources externes du kit répondent encore
# (dépôts de skills + URLs llms.txt/MCP). Si l'une bouge/disparaît, le job rougit → on est prévenu.
on:
  schedule:
    - cron: '0 6 * * 1'   # tous les lundis 06:00 UTC
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ⚠️ DÉRIVÉE de `scripts/lib/matrix.mjs` comme la boucle d'URLs ci-dessous : tout dépôt qu'une
      # stack fait cloner (`plugins[*].cmd`) doit y être. Garde : `faits-stacks.test.mjs`, F12bis.
      - name: Dépôts de skills et de plugins (GitHub) — doivent répondre 2xx/3xx
        run: |
          set -e
          for r in \
            better-auth/skills get-convex/agent-skills expo/skills \
            get-convex/convex-agent-plugins \
            google-labs-code/stitch-skills anthropics/skills \
            vercel-labs/agent-skills nextlevelbuilder/ui-ux-pro-max-skill \
            multica-ai/andrej-karpathy-skills \
            getsentry/skills openai/skills ; do
            code=$(curl -m 10 -o /dev/null -s -w '%{http_code}' "https://github.com/$r")
            echo "$r -> $code"
            [ "$code" -lt 400 ] || { echo "::error::dépôt de skills injoignable : $r ($code)"; exit 1; }
          done
      # ⚠️ CETTE LISTE EST DÉRIVÉE DE `scripts/lib/matrix.mjs` : toute URL qu'une stack déclare
      # (`mcp`, `rules`) doit s'y trouver, sinon elle disparaît un jour sans que rien ne rougisse.
      # Le garde qui l'exige : `faits-stacks.test.mjs`, F12bis. Il en avait déjà trouvé trois
      # oubliées (les deux docs Electron et l'installeur Maestro), en plus de la recette Docker.
      - name: URLs de contexte (llms.txt / règles) — doivent répondre 2xx/3xx
        run: |
          set -e
          for u in \
            https://convex.link/convex_rules.txt \
            https://tanstack.com/start/latest/llms.txt \
            https://better-auth.com/llms.txt \
            https://docs.expo.dev/llms.txt \
            https://reactnative.dev/llms.txt \
            https://ui.shadcn.com/docs/installation/astro \
            https://docs.astro.build/en/recipes/docker/ \
            https://www.electronjs.org/docs/latest/tutorial/security \
            https://www.electronjs.org/docs/latest \
            https://get.maestro.mobile.dev \
            https://labs.convex.dev/better-auth/framework-guides/tanstack-start \
            https://www.nativewind.dev/getting-started/installation \
            https://tweakcn.com \
            "https://ui.shadcn.com/create?preset=b27GcrRo" ; do
            code=$(curl -m 10 -o /dev/null -s -w '%{http_code}' "$u")
            echo "$u -> $code"
            [ "$code" -lt 400 ] || { echo "::error::source de contexte injoignable : $u ($code)"; exit 1; }
          done
      # Un paquet déprécié répond 200 sur npmjs.com : le contrôle HTTP ne l'a jamais vu passer.
      # Le kit a recommandé pendant des mois un paquet dont TOUTES les versions étaient
      # dépréciées (« Package no longer supported »). Le champ `deprecated` est le seul signal.
      - name: Paquets npm recommandés — aucun ne doit être déprécié
        run: |
          set -e
          fail=0
          for p in astro react-email @convex-dev/resend @convex-dev/auth convex expo electron \
                   better-auth @convex-dev/better-auth @playwright/mcp ; do
            dep=$(npm view "$p" deprecated 2>/dev/null || true)
            ver=$(npm view "$p" version 2>/dev/null || echo '?')
            if [ -n "$dep" ]; then
              echo "::error::paquet déprécié recommandé par le kit : $p@$ver — $dep"; fail=1
            else
              echo "$p@$ver -> ok"
            fi
          done
          [ "$fail" -eq 0 ]
      # Le majeur épinglé (scripts/lib/matrix.mjs → PINS) doit rester celui qu'npm publie :
      # sinon la doc de la stack décrit une version que plus personne n'installe.
      - name: Majeur épinglé vs majeur publié
        run: |
          set -e
          pin=$(node -e "import('./scripts/lib/matrix.mjs').then(m => console.log(m.PINS.vitrine.astro))")
          cur=$(npm view astro version | cut -d. -f1)
          echo "astro : épinglé $pin · publié $cur"
          [ "$pin" = "$cur" ] || { echo "::error::Astro est passé au majeur $cur, le kit est épinglé sur $pin (voir PINS dans scripts/lib/matrix.mjs)"; exit 1; }
      - name: Endpoints MCP — vivants si < 500 (401/403/405 sur GET nu = OK)
        run: |
          set -e
          for u in \
            https://stitch.googleapis.com/mcp \
            https://mcp.better-auth.com/mcp \
            https://mcp.expo.dev/mcp \
            https://mcp.docs.astro.build/mcp \
            https://mcp.stripe.com ; do
            code=$(curl -m 10 -o /dev/null -s -w '%{http_code}' "$u")
            echo "$u -> $code"
            [ "$code" -lt 500 ] || { echo "::error::endpoint MCP injoignable : $u ($code)"; exit 1; }
          done
