<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Le kit pose des rails : règles de la stack, mémoire du projet, revue et sécurité, test en vrai — l'IA avance guidée">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .gate { font-size: 15px; font-weight: 700; fill: #065f46; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #047857; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="428" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="38" width="158" height="32" rx="16" fill="#d1fae5"/>
  <circle cx="68" cy="54" r="5" fill="#10b981"/>
  <text class="t eyebrow" x="84" y="59">LA SOLUTION</text>

  <text class="t h" x="48" y="112">Le kit pose des rails.</text>
  <text class="t s" x="48" y="144">Les règles officielles, la mémoire du projet, la revue et les tests : l'IA avance guidée, pas à l'aveugle.</text>

  <!-- rail -->
  <line x1="60" y1="352" x2="940" y2="352" stroke="#94a3b8" stroke-width="4"/>
  <line x1="60" y1="372" x2="940" y2="372" stroke="#94a3b8" stroke-width="4"/>
  <g stroke="#cbd5e1" stroke-width="4">
    <line x1="100" y1="350" x2="100" y2="374"/><line x1="160" y1="350" x2="160" y2="374"/>
    <line x1="220" y1="350" x2="220" y2="374"/><line x1="280" y1="350" x2="280" y2="374"/>
    <line x1="340" y1="350" x2="340" y2="374"/><line x1="400" y1="350" x2="400" y2="374"/>
    <line x1="460" y1="350" x2="460" y2="374"/><line x1="520" y1="350" x2="520" y2="374"/>
    <line x1="580" y1="350" x2="580" y2="374"/><line x1="640" y1="350" x2="640" y2="374"/>
    <line x1="700" y1="350" x2="700" y2="374"/><line x1="760" y1="350" x2="760" y2="374"/>
    <line x1="820" y1="350" x2="820" y2="374"/><line x1="880" y1="350" x2="880" y2="374"/>
  </g>

  <!-- le petit robot sur le rail -->
  <g transform="translate(96,296)">
    <rect x="0" y="0" width="78" height="56" rx="16" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="6" fill="#4338ca"/>
    <circle cx="54" cy="26" r="6" fill="#4338ca"/>
    <path d="M26 42 Q39 52 52 42" stroke="#4338ca" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <line x1="39" y1="0" x2="39" y2="-12" stroke="#f43f5e" stroke-width="3.5"/>
    <circle cx="39" cy="-15" r="5" fill="#f43f5e"/>
  </g>

  <!-- gates -->
  <g>
    <g transform="translate(206,190)">
      <rect x="0" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="150" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="0" y="0" width="158" height="14" rx="7" fill="#a7f3d0"/>
      <circle cx="79" cy="7" r="0"/>
      <text class="t gate" x="79" y="-14" text-anchor="middle">règles de la stack</text>
      <circle cx="79" cy="46" r="20" fill="#10b981"/>
      <text x="79" y="54" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" font-family="-apple-system, Arial">✓</text>
    </g>

    <g transform="translate(410,190)">
      <rect x="0" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="150" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="0" y="0" width="158" height="14" rx="7" fill="#a7f3d0"/>
      <text class="t gate" x="79" y="-14" text-anchor="middle">mémoire du projet</text>
      <circle cx="79" cy="46" r="20" fill="#10b981"/>
      <text x="79" y="54" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" font-family="-apple-system, Arial">✓</text>
    </g>

    <g transform="translate(614,190)">
      <rect x="0" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="150" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="0" y="0" width="158" height="14" rx="7" fill="#a7f3d0"/>
      <text class="t gate" x="79" y="-14" text-anchor="middle">revue + sécurité</text>
      <circle cx="79" cy="46" r="20" fill="#10b981"/>
      <text x="79" y="54" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" font-family="-apple-system, Arial">✓</text>
    </g>

    <g transform="translate(818,190)">
      <rect x="0" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="150" y="0" width="8" height="166" fill="#d1fae5"/>
      <rect x="0" y="0" width="158" height="14" rx="7" fill="#a7f3d0"/>
      <text class="t gate" x="79" y="-14" text-anchor="middle">test en vrai</text>
      <circle cx="79" cy="46" r="20" fill="#10b981"/>
      <text x="79" y="54" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" font-family="-apple-system, Arial">✓</text>
    </g>
  </g>

  <text class="t" x="48" y="404" font-size="16" fill="#059669" font-weight="700">Résultat : une app qui marche, pas une démo cassée.</text>
</svg>
