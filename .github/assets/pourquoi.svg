<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Moins d'outils, moins d'erreurs : cinq outils à assembler contre une seule brique Convex, et les autres choix de techno">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #4338ca; }
      .ph { font-size: 17px; font-weight: 800; }
      .li { font-size: 14px; fill: #334155; }
      .chip { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #334155; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="478" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="34" width="248" height="32" rx="16" fill="#e0e7ff"/>
  <circle cx="68" cy="50" r="5" fill="#4f46e5"/>
  <text class="t eyebrow" x="84" y="55">POURQUOI CES TECHNOS</text>

  <text class="t h" x="48" y="106">Moins d'outils, moins d'erreurs.</text>
  <text class="t s" x="48" y="138">À chaque brique, on garde celle où toi et l'IA en faites le moins.</text>

  <!-- Sans Convex -->
  <rect x="40" y="164" width="430" height="150" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text class="t ph" x="68" y="198" fill="#b91c1c">Sans Convex : 5 outils à assembler</text>
  <g class="t li">
    <rect x="68" y="212" width="120" height="26" rx="13" fill="#fee2e2"/><text x="128" y="230" text-anchor="middle">Base de données</text>
    <rect x="200" y="212" width="120" height="26" rx="13" fill="#fee2e2"/><text x="260" y="230" text-anchor="middle">API</text>
    <rect x="332" y="212" width="110" height="26" rx="13" fill="#fee2e2"/><text x="387" y="230" text-anchor="middle">Temps réel</text>
    <rect x="68" y="248" width="140" height="26" rx="13" fill="#fee2e2"/><text x="138" y="266" text-anchor="middle">Tâches (cron)</text>
    <rect x="220" y="248" width="150" height="26" rx="13" fill="#fee2e2"/><text x="295" y="266" text-anchor="middle">Stockage de fichiers</text>
  </g>
  <text class="t li" x="68" y="298" fill="#b91c1c">…autant d'endroits où se tromper, et à faire tenir ensemble.</text>

  <!-- Avec Convex -->
  <rect x="510" y="164" width="450" height="150" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text class="t ph" x="538" y="198" fill="#047857">Avec Convex : une seule brique</text>
  <text class="t li" x="538" y="230">base + API + temps réel + tâches + fichiers,</text>
  <text class="t li" x="538" y="252">écrits dans <tspan font-weight="700">la même langue que le front</tspan> : TypeScript.</text>
  <text class="t li" x="538" y="284" fill="#047857">✅ 1 seul modèle en tête pour l'IA · ✅ l'écran se met à jour tout seul.</text>

  <!-- autres briques -->
  <g>
    <rect x="40" y="330" width="300" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="t chip" x="64" y="352">TanStack Start — le front</text>
    <text class="t mono" x="64" y="372">routing typé → moins d'erreurs</text>

    <rect x="352" y="330" width="300" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="t chip" x="376" y="352">Better Auth — l'authentification</text>
    <text class="t mono" x="376" y="372">clé en main, auto-hébergée</text>

    <rect x="664" y="330" width="296" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="t chip" x="688" y="352">Astro · Expo · Electron</text>
    <text class="t mono" x="688" y="372">un choix par cible</text>
  </g>

  <rect x="40" y="398" width="920" height="56" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text class="t" x="500" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Des skills par techno, les règles officielles dans ai-context/, et les MCP branchés : l'IA ne devine pas.</text>
  <text class="t" x="500" y="442" text-anchor="middle" font-size="13" fill="#6d28d9">C'est la règle du kit : la techno où toi ET l'IA faites le moins d'erreurs.</text>
</svg>
