<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Le filet de sécurité : trois tentatives maximum, un point de restauration, et les commandes /next et /sos">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #b45309; }
      .cardh { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .cardp { font-size: 14px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
      .emoji { font-size: 32px; }
      .dot { font-size: 18px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="398" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="36" width="246" height="32" rx="16" fill="#fef3c7"/>
  <circle cx="68" cy="52" r="5" fill="#d97706"/>
  <text class="t eyebrow" x="84" y="57">LE FILET DE SÉCURITÉ</text>

  <text class="t h" x="48" y="108">Bloqué ? Le kit a prévu la sortie.</text>
  <text class="t s" x="48" y="140">Pas de boucle infinie, pas de dossier qu'on n'ose plus toucher.</text>

  <!-- carte 1 : 3 tentatives -->
  <rect x="40" y="172" width="300" height="164" rx="20" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text class="t emoji" x="80" y="228">🎯</text>
  <text class="t cardh" x="72" y="268">3 tentatives maximum</text>
  <circle cx="98" cy="300" r="14" fill="#f59e0b"/>
  <text class="t dot" x="98" y="306" text-anchor="middle">1</text>
  <circle cx="140" cy="300" r="14" fill="#f59e0b"/>
  <text class="t dot" x="140" y="306" text-anchor="middle">2</text>
  <circle cx="182" cy="300" r="14" fill="#f59e0b"/>
  <text class="t dot" x="182" y="306" text-anchor="middle">3</text>
  <circle cx="236" cy="300" r="16" fill="#dc2626"/>
  <text class="t dot" x="236" y="306" text-anchor="middle" font-size="15">✕</text>
  <text class="t cardp" x="262" y="306">on s'arrête</text>

  <text class="t arrow" x="356" y="256" text-anchor="middle" font-size="24" fill="#fcd34d" font-weight="800">→</text>

  <!-- carte 2 : point vert -->
  <rect x="380" y="172" width="252" height="164" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text class="t emoji" x="420" y="228">🏷️</text>
  <text class="t cardh" x="412" y="268">Dernier point vert</text>
  <text class="t cardp" x="412" y="298">chaque jalon validé est</text>
  <text class="t cardp" x="412" y="318">marqué (un tag git).</text>

  <text class="t arrow" x="648" y="256" text-anchor="middle" font-size="24" fill="#fcd34d" font-weight="800">→</text>

  <!-- carte 3 : commandes -->
  <rect x="672" y="172" width="288" height="164" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="t emoji" x="712" y="228">🆘</text>
  <text class="t cardh" x="704" y="268">Deux commandes-amies</text>
  <rect x="704" y="286" width="224" height="30" rx="15" fill="#dbeafe"/>
  <text class="t mono" x="720" y="306" fill="#1e40af">/next</text>
  <text class="t cardp" x="820" y="306">je fais quoi ?</text>
  <rect x="704" y="322" width="224" height="30" rx="15" fill="#fee2e2"/>
  <text class="t mono" x="720" y="342" fill="#b91c1c">/sos</text>
  <text class="t cardp" x="780" y="342">ça casse</text>
</svg>
