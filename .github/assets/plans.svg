<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="La feuille de route génère un plan par jalon pour toute l'app, puis /build exécute les jalons jusqu'au bout">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #6d28d9; }
      .chip { font-size: 14px; font-weight: 800; fill: #1e293b; }
      .doc { font-size: 12px; fill: #6d28d9; }
      .bar { font-size: 14px; font-weight: 700; fill: #065f46; }
      .emoji { font-size: 26px; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="418" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="36" width="232" height="32" rx="16" fill="#ede9fe"/>
  <circle cx="68" cy="52" r="5" fill="#7c3aed"/>
  <text class="t eyebrow" x="84" y="57">TOUS LES PLANS, PUIS LE BUILD</text>

  <text class="t h" x="48" y="108">La feuille de route devient tous les plans.</text>
  <text class="t s" x="48" y="140">Un plan par jalon, pour toute l'app — skills + docs à jour + maquette. Puis /build va jusqu'au bout.</text>

  <!-- jalons -> plans -->
  <g>
    <rect x="48" y="176" width="200" height="92" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text class="t chip" x="148" y="212" text-anchor="middle">Jalon 0</text>
    <text class="t doc" x="148" y="238" text-anchor="middle">plan 00 — fondations</text>

    <rect x="272" y="176" width="200" height="92" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text class="t chip" x="372" y="212" text-anchor="middle">Jalon 1</text>
    <text class="t doc" x="372" y="238" text-anchor="middle">plan 01 — données</text>

    <rect x="496" y="176" width="200" height="92" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text class="t chip" x="596" y="212" text-anchor="middle">Jalon 2</text>
    <text class="t doc" x="596" y="238" text-anchor="middle">plan 02 — auth</text>

    <rect x="720" y="176" width="232" height="92" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="t chip" x="836" y="212" text-anchor="middle">Jalon N</text>
    <text class="t doc" x="836" y="238" text-anchor="middle">plan NN — audit stack</text>
  </g>

  <text class="t" x="500" y="300" text-anchor="middle" font-size="24" fill="#a78bfa" font-weight="800">↓</text>

  <!-- build bar -->
  <rect x="48" y="318" width="904" height="72" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text class="t" x="76" y="352" font-size="20">🚀</text>
  <text class="t bar" x="112" y="360">/build enchaîne tous les jalons jusqu'au bout : visuel + leçon à chaque étape, puis il continue seul.</text>
  <text class="t" x="112" y="382" font-size="13" fill="#64748b">Il ne s'arrête que sur un vrai blocage (BLOQUÉ) ou une décision humaine. L'option --step rend la main à chaque jalon.</text>
</svg>
