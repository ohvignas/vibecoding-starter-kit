<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Les 4 stacks au choix : SaaS web, mobile, desktop et vitrine, chacune avec ses technologies">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #0369a1; }
      .name { font-size: 19px; font-weight: 800; fill: #0f172a; }
      .desc { font-size: 14px; fill: #475569; }
      .chip { font-size: 12px; font-weight: 700; fill: #334155; }
      .emoji { font-size: 42px; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="438" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="36" width="172" height="32" rx="16" fill="#e0f2fe"/>
  <circle cx="68" cy="52" r="5" fill="#0284c7"/>
  <text class="t eyebrow" x="84" y="57">LES 4 STACKS</text>

  <text class="t h" x="48" y="108">Quatre types d'app. Choisis le tien.</text>
  <text class="t s" x="48" y="140">Le wizard veut savoir ce que tu construis — le reste est déjà câblé.</text>

  <!-- carte 1 -->
  <rect x="40" y="172" width="218" height="230" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="t emoji" x="149" y="238" text-anchor="middle">💻</text>
  <text class="t name" x="149" y="274" text-anchor="middle">SaaS / web</text>
  <text class="t desc" x="149" y="300" text-anchor="middle">une appli où l'on</text>
  <text class="t desc" x="149" y="320" text-anchor="middle">crée un compte</text>
  <g>
    <rect x="60" y="340" width="178" height="24" rx="12" fill="#dbeafe"/>
    <text class="t chip" x="149" y="357" text-anchor="middle">Convex · TanStack</text>
    <rect x="60" y="370" width="178" height="24" rx="12" fill="#dbeafe"/>
    <text class="t chip" x="149" y="387" text-anchor="middle">Better Auth</text>
  </g>

  <!-- carte 2 -->
  <rect x="274" y="172" width="218" height="230" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text class="t emoji" x="383" y="238" text-anchor="middle">📱</text>
  <text class="t name" x="383" y="274" text-anchor="middle">Mobile</text>
  <text class="t desc" x="383" y="300" text-anchor="middle">iOS + Android,</text>
  <text class="t desc" x="383" y="320" text-anchor="middle">une seule fois</text>
  <g>
    <rect x="294" y="340" width="178" height="24" rx="12" fill="#d1fae5"/>
    <text class="t chip" x="383" y="357" text-anchor="middle">Expo (React Native)</text>
    <rect x="294" y="370" width="178" height="24" rx="12" fill="#d1fae5"/>
    <text class="t chip" x="383" y="387" text-anchor="middle">Convex</text>
  </g>

  <!-- carte 3 -->
  <rect x="508" y="172" width="218" height="230" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="t emoji" x="617" y="238" text-anchor="middle">🖥️</text>
  <text class="t name" x="617" y="274" text-anchor="middle">Desktop</text>
  <text class="t desc" x="617" y="300" text-anchor="middle">une appli à</text>
  <text class="t desc" x="617" y="320" text-anchor="middle">installer</text>
  <g>
    <rect x="528" y="340" width="178" height="24" rx="12" fill="#ffedd5"/>
    <text class="t chip" x="617" y="357" text-anchor="middle">Electron</text>
    <rect x="528" y="370" width="178" height="24" rx="12" fill="#ffedd5"/>
    <text class="t chip" x="617" y="387" text-anchor="middle">React · TypeScript</text>
  </g>

  <!-- carte 4 -->
  <rect x="742" y="172" width="218" height="230" rx="20" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text class="t emoji" x="851" y="238" text-anchor="middle">🌐</text>
  <text class="t name" x="851" y="274" text-anchor="middle">Vitrine</text>
  <text class="t desc" x="851" y="300" text-anchor="middle">site, blog,</text>
  <text class="t desc" x="851" y="320" text-anchor="middle">trouvable (SEO + IA)</text>
  <g>
    <rect x="762" y="340" width="178" height="24" rx="12" fill="#ede9fe"/>
    <text class="t chip" x="851" y="357" text-anchor="middle">Astro · Convex</text>
    <rect x="762" y="370" width="178" height="24" rx="12" fill="#ede9fe"/>
    <text class="t chip" x="851" y="387" text-anchor="middle">Better Auth</text>
  </g>
</svg>
