<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Démarrer en 4 étapes : lancer le wizard, coller le prompt, installer superpowers et autoriser les MCP, puis taper /help">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #4338ca; }
      .step { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #312e81; }
      .num { font-size: 14px; font-weight: 800; fill: #ffffff; }
      .emoji { font-size: 34px; }
      .arrow { font-size: 22px; fill: #a5b4fc; font-weight: 800; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="378" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="36" width="152" height="32" rx="16" fill="#e0e7ff"/>
  <circle cx="68" cy="52" r="5" fill="#4f46e5"/>
  <text class="t eyebrow" x="84" y="57">DÉMARRER</text>

  <text class="t h" x="48" y="108">En 4 étapes, tu es dans le bain.</text>
  <text class="t s" x="48" y="140">Compte cinq minutes. Aucun compte à créer, aucun code à écrire.</text>

  <g>
    <rect x="40" y="172" width="216" height="152" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="64" cy="196" r="15" fill="#4f46e5"/>
    <text class="t num" x="64" y="201" text-anchor="middle">1</text>
    <text class="t emoji" x="148" y="200" text-anchor="middle">⌨️</text>
    <text class="t step" x="60" y="244">Lance le wizard</text>
    <text class="t mono" x="60" y="270">npm create</text>
    <text class="t mono" x="60" y="288">vibecoding-kit</text>
  </g>
  <text class="t arrow" x="266" y="248" text-anchor="middle">→</text>

  <g>
    <rect x="274" y="172" width="216" height="152" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <circle cx="298" cy="196" r="15" fill="#7c3aed"/>
    <text class="t num" x="298" y="201" text-anchor="middle">2</text>
    <text class="t emoji" x="382" y="200" text-anchor="middle">🧩</text>
    <text class="t step" x="294" y="244">Colle le prompt</text>
    <text class="t sub" x="294" y="270">dans ton assistant IA</text>
    <text class="t sub" x="294" y="288">(Cursor, Claude, Codex)</text>
  </g>
  <text class="t arrow" x="500" y="248" text-anchor="middle">→</text>

  <g>
    <rect x="508" y="172" width="216" height="152" rx="18" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="532" cy="196" r="15" fill="#0891b2"/>
    <text class="t num" x="532" y="201" text-anchor="middle">3</text>
    <text class="t emoji" x="616" y="200" text-anchor="middle">🔌</text>
    <text class="t step" x="528" y="244">Deux gestes dans l'IA</text>
    <text class="t sub" x="528" y="270">installe superpowers</text>
    <text class="t sub" x="528" y="288">et autorise les MCP</text>
  </g>
  <text class="t arrow" x="734" y="248" text-anchor="middle">→</text>

  <g>
    <rect x="742" y="172" width="218" height="152" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="766" cy="196" r="15" fill="#16a34a"/>
    <text class="t num" x="766" y="201" text-anchor="middle">4</text>
    <text class="t emoji" x="852" y="200" text-anchor="middle">🆘</text>
    <text class="t step" x="762" y="244">Tape /help</text>
    <text class="t sub" x="762" y="270">et c'est parti :</text>
    <text class="t mono" x="762" y="288" fill="#166534">/new-project</text>
  </g>
</svg>
