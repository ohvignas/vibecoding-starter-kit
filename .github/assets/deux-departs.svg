<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Deux façons de commencer : partir de zéro, ou adopter un projet qui existe déjà — la même méthode dans les deux cas">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #1d4ed8; }
      .cardh { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .cardp { font-size: 15px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
      .emoji { font-size: 26px; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="418" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="36" width="308" height="32" rx="16" fill="#dbeafe"/>
  <circle cx="68" cy="52" r="5" fill="#2563eb"/>
  <text class="t eyebrow" x="84" y="57">DEUX FAÇONS DE COMMENCER</text>

  <text class="t h" x="48" y="108">Tu pars de zéro, ou tu as déjà du code.</text>
  <text class="t s" x="48" y="140">Le kit s'adapte. La méthode, elle, ne change pas.</text>

  <!-- Carte gauche -->
  <rect x="40" y="172" width="440" height="184" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="t emoji" x="72" y="212">🆕</text>
  <text class="t cardh" x="112" y="212">Je pars de zéro</text>
  <text class="t cardp" x="72" y="246">Le wizard choisit la stack, écrit le</text>
  <text class="t cardp" x="72" y="268">code de départ, la CI, la maquette.</text>
  <rect x="72" y="286" width="376" height="46" rx="12" fill="#0f172a"/>
  <text class="t mono" x="92" y="314" fill="#e2e8f0">npm create vibecoding-kit@latest</text>

  <!-- Carte droite -->
  <rect x="520" y="172" width="440" height="184" rx="20" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text class="t emoji" x="552" y="212">🧬</text>
  <text class="t cardh" x="592" y="212">J'ai déjà un projet</text>
  <text class="t cardp" x="552" y="246">La méthode arrive à côté du tien,</text>
  <text class="t cardp" x="552" y="268">rien n'est écrasé.</text>
  <rect x="552" y="286" width="376" height="46" rx="12" fill="#0f172a"/>
  <text class="t mono" x="572" y="314" fill="#e2e8f0">npx create-vibecoding-kit --adopt</text>

  <!-- bandeau méthode -->
  <rect x="40" y="372" width="920" height="36" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="t" x="500" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">MÊME MÉTHODE DANS LES DEUX CAS — 10 commandes · 7 agents · la mémoire du projet</text>
</svg>
