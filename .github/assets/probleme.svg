<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Sans contexte, l'intelligence artificielle devine : API inexistante, code périmé, décision oubliée — et l'app casse">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 31px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 17px; fill: #475569; }
      .lbl { font-size: 16px; font-weight: 700; fill: #334155; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #b91c1c; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #334155; }
      .chip { font-size: 16px; font-weight: 600; fill: #7f1d1d; }
      .emoji { font-size: 40px; }
      .emojism { font-size: 30px; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="428" rx="24" fill="#ffffff" stroke="#e5e9f2" stroke-width="1.5"/>

  <rect x="48" y="38" width="172" height="32" rx="16" fill="#fee2e2"/>
  <circle cx="68" cy="54" r="5" fill="#ef4444"/>
  <text class="t eyebrow" x="84" y="59">LE PROBLÈME</text>

  <text class="t h" x="48" y="112">Sans contexte, l'IA devine.</text>
  <text class="t s" x="48" y="144">Seule, elle invente des API, oublie tes décisions et code une interface hors charte.</text>

  <!-- 1. Toi + ton idée -->
  <rect x="48" y="186" width="248" height="196" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="t emoji" x="74" y="246">💡</text>
  <text class="t lbl" x="74" y="284">Ton idée</text>
  <text class="t mono" x="74" y="312">« une appli de résa »</text>
  <text class="t mono" x="74" y="336" fill="#64748b">tu en parles à l'IA</text>

  <!-- flèche 1 -> 2 -->
  <path d="M300 284 H352" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="7 7" fill="none"/>
  <path d="M346 276 L360 284 L346 292 Z" fill="#a5b4fc"/>

  <!-- 2. L'IA seule -->
  <g>
    <line x1="446" y1="196" x2="446" y2="172" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="446" cy="166" r="8" fill="#f43f5e"/>
    <rect x="376" y="196" width="140" height="112" rx="28" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <circle cx="416" cy="248" r="9" fill="#4338ca"/>
    <circle cx="476" cy="248" r="9" fill="#4338ca"/>
    <path d="M418 274 Q446 292 474 274" stroke="#4338ca" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 3. Ce qu'elle produit -->
  <g>
    <rect x="548" y="188" width="332" height="56" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="580" cy="216" r="13" fill="#ef4444"/>
    <text class="t chip" x="580" y="222" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">✕</text>
    <text class="t chip" x="606" y="222">une API qui n'existe pas</text>

    <rect x="548" y="256" width="332" height="56" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="580" cy="284" r="13" fill="#ef4444"/>
    <text class="t chip" x="580" y="290" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">✕</text>
    <text class="t chip" x="606" y="290">du code périmé depuis 2 ans</text>

    <rect x="548" y="324" width="332" height="56" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="580" cy="352" r="13" fill="#ef4444"/>
    <text class="t chip" x="580" y="358" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">✕</text>
    <text class="t chip" x="606" y="358">la décision d'hier, oubliée</text>
  </g>

  <!-- résultat -->
  <text class="t" x="548" y="410" font-size="16" font-weight="800" fill="#b91c1c">Résultat : l'app casse, et il faut tout reprendre à la main.</text>
</svg>
