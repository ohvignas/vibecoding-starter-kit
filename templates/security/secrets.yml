name: Secret scan
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v2 tourne sur le runtime Node 20, que GitHub retire des runners le 16/09/2026 :
      # laissée en v2, cette action cesse purement et simplement de scanner. v3 est un
      # remplacement direct (« No changes to inputs, outputs, or behavior »).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
